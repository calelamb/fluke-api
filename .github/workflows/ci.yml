name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: fluke
          POSTGRES_PASSWORD: fluke_test_password
          POSTGRES_DB: fluke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluke -d fluke_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fluke:fluke_test_password@localhost:5432/fluke_test
      DIRECT_URL: postgresql://fluke:fluke_test_password@localhost:5432/fluke_test
      JWT_SECRET: ci_only_jwt_secret_at_least_32_characters
      NODE_ENV: test
      WEB_ORIGIN: http://localhost:5174
      API_PUBLIC_ORIGIN: http://localhost:4000
      IDENTIFIER_SERVICE_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm layout:check
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
      - name: Scan changed commits with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1
      - name: Scan full Git history with Gitleaks
        run: gitleaks git --log-opts=--all --redact --no-banner .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fluke-api:ci
          load: true
      - name: Smoke container readiness
        run: |
          docker run -d --name fluke-api-ci --network host \
            -e DATABASE_URL \
            -e DIRECT_URL \
            -e JWT_SECRET \
            -e NODE_ENV=production \
            -e WEB_ORIGIN=https://web.ci.invalid \
            -e API_PUBLIC_ORIGIN=https://api.ci.invalid \
            -e IDENTIFIER_SERVICE_URL \
            fluke-api:ci
          cleanup() {
            exit_code=$?
            if ((exit_code != 0)); then
              docker logs fluke-api-ci || true
            fi
            docker rm --force fluke-api-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:4000/api/v1/ready && exit 0
            if [[ "$(docker inspect --format '{{.State.Running}}' fluke-api-ci 2>/dev/null || true)" != true ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1
